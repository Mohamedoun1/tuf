name: TUF-on-CI publish

permissions: {}

on:
  workflow_dispatch:
    inputs:
      ref:
        type: string
        required: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - id: build-and-upload-repository
        uses: theupdateframework/tuf-on-ci/actions/upload-repository@4e63a5934064216b7caa7a4a833b1b0936bec660 # v0.20.0
        with:
          gh_pages: true
          ref: ${{ inputs.ref }}
          metadata_path: './'

      - name: Create unversioned metadata symlinks
        run: |
          cd github-pages/metadata
          # Create symlinks from versioned to unversioned names for TUF client compatibility
          ln -sf 1.root.json root.json || true
          # Find and link the latest snapshot.json and targets.json
          SNAPSHOT_VERSION=$(ls -1 *.snapshot.json 2>/dev/null | sed 's/\([0-9]*\)\.snapshot\.json/\1/' | sort -n | tail -1)
          TARGETS_VERSION=$(ls -1 *.targets.json 2>/dev/null | sed 's/\([0-9]*\)\.targets\.json/\1/' | sort -n | tail -1)
          [ -n "$SNAPSHOT_VERSION" ] && ln -sf ${SNAPSHOT_VERSION}.snapshot.json snapshot.json || true
          [ -n "$TARGETS_VERSION" ] && ln -sf ${TARGETS_VERSION}.targets.json targets.json || true
          ls -la

  deploy-to-pages:
    permissions:
      pages: write
      id-token: write # for authenticating to GH Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy TUF-on-CI repository to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  test-deployed-repository:
    needs: deploy-to-pages
    permissions:
      contents: read # for checking out the repository
      issues: write # for modifying Issues
    uses: ./.github/workflows/test.yml

  update-issue:
    runs-on: ubuntu-latest
    needs: [build, deploy-to-pages, test-deployed-repository]
    if: always() && !cancelled()
    permissions:
      issues: write # for modifying Issues
      contents: read # for checking out the repository
    steps:
      - name: Update the issue for the workflow
        uses: theupdateframework/tuf-on-ci/actions/update-issue@4e63a5934064216b7caa7a4a833b1b0936bec660 # v0.20.0
        with:
          token: ${{ secrets.TUF_ON_CI_TOKEN || secrets.GITHUB_TOKEN }}
          success: ${{ !contains(needs.*.result, 'failure') }}
